name: fork-preflight

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Contribution commit to validate
        required: true
        type: string

env:
  GOPROXY: https://proxy.golang.org/

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: go mod download -x
      - run: go mod verify
      - run: go run github.com/mh-cbon/go-fmt-fail ./...
      - run: go test -cover -covermode=atomic -timeout=5m -race ./...

  generate-provider-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: go generate ./internal/schemas
      - run: du -h -s ./internal/schemas/data

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: '386' }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: arm64 }
          - { goos: freebsd, goarch: '386' }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm }
          - { goos: openbsd, goarch: '386' }
          - { goos: openbsd, goarch: amd64 }
          - { goos: solaris, goarch: amd64 }
          - { goos: windows, goarch: '386' }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: |
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
